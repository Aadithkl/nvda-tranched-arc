specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NVDAPriceOracle
    network: arc-testnet
    source:
      address: "0xa2c6489fA9b1dba1ec63f410AB042543c86aa15F"
      abi: NVDAPriceOracle
      startBlock: 61452836
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - OracleState
        - PriceUpdate
      abis:
        - name: NVDAPriceOracle
          file: ./abis/NVDAPriceOracle.json
      eventHandlers:
        - event: "PriceUpdated(indexed bytes32,uint8,int192,int192,int192,uint32,uint32,uint256)"
          handler: handlePriceUpdated
        - event: "X402PriceUpdated(indexed address,int192,uint32,uint32,bytes32,uint256)"
          handler: handleX402PriceUpdated
        - event: "MarketStatusUpdated(uint32)"
          handler: handleMarketStatusUpdated
        - event: "PrimarySourceUpdated(uint8)"
          handler: handlePrimarySourceUpdated
      file: ./src/oracle.ts
  - kind: ethereum
    name: PoolManager
    network: arc-testnet
    source:
      address: "0xF570d08D4388D6487E348C28c00D714a347D33c4"
      abi: PoolManager
      startBlock: 61452715
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - PoolSwap
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: "Initialize(indexed bytes32,indexed address,indexed address,uint24,int24,address,uint160,int24)"
          handler: handleInitialize
        - event: "Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)"
          handler: handleSwap
      file: ./src/poolManager.ts

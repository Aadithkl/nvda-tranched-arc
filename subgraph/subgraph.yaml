specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NVDAPriceOracle
    network: arc-testnet
    source:
      address: "0x2D58dE768ABff2da0e4a00BE92f63DFB6CE0738A"
      abi: NVDAPriceOracle
      startBlock: 61455183
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - OracleState
        - PriceUpdate
      abis:
        - name: NVDAPriceOracle
          file: ./abis/NVDAPriceOracle.json
      eventHandlers:
        - event: "PriceUpdated(indexed address,int192,uint32,uint32,bytes32,uint256)"
          handler: handlePriceUpdated
        - event: "MarketStatusUpdated(uint32)"
          handler: handleMarketStatusUpdated
      file: ./src/oracle.ts
  - kind: ethereum
    name: PoolManager
    network: arc-testnet
    source:
      address: "0xFc4146c0de93B518Ce60158e2eD0943697c3Ae67"
      abi: PoolManager
      startBlock: 61459445
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - PoolSwap
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: "Initialize(indexed bytes32,indexed address,indexed address,uint24,int24,address,uint160,int24)"
          handler: handleInitialize
        - event: "Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)"
          handler: handleSwap
      file: ./src/poolManager.ts

specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NVDAPriceOracle
    network: arc-testnet
    source:
      address: "0x2D58dE768ABff2da0e4a00BE92f63DFB6CE0738A"
      abi: NVDAPriceOracle
      startBlock: 61891077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - OracleState
        - PriceUpdate
      abis:
        - name: NVDAPriceOracle
          file: ./abis/NVDAPriceOracle.json
      eventHandlers:
        - event: "PriceUpdated(indexed address,int192,uint32,uint32,bytes32,uint256)"
          handler: handlePriceUpdated
        - event: "MarketStatusUpdated(uint32)"
          handler: handleMarketStatusUpdated
      file: ./src/oracle.ts
  - kind: ethereum
    name: PoolManager
    network: arc-testnet
    source:
      address: "0xFc4146c0de93B518Ce60158e2eD0943697c3Ae67"
      abi: PoolManager
      startBlock: 61891077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - PoolSwap
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: "Initialize(indexed bytes32,indexed address,indexed address,uint24,int24,address,uint160,int24)"
          handler: handleInitialize
        - event: "Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)"
          handler: handleSwap
      file: ./src/poolManager.ts
  # Address synced from deployments/arc-testnet.json (npm run subgraph:sync)
  - kind: ethereum
    name: TrancheJITHook
    network: arc-testnet
    source:
      address: "0x5C374e0B4F3646705839BE9D2b45F6753EAC6aC0"
      abi: TrancheJITHook
      startBlock: 61891077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - HookState
        - Quote
        - JitDeployment
        - JitRemoval
        - ClaimRedemption
        - ShareFlow
        - ParamChange
        - YieldAggregator
        - Token
        - Vault
        - VaultFee
        - RewardToken
        - Deposit
        - Withdraw
        - VaultDailySnapshot
        - VaultHourlySnapshot
        - UsageMetricsDailySnapshot
        - UsageMetricsHourlySnapshot
        - FinancialsDailySnapshot
        - Account
        - ActiveAccount
      abis:
        - name: TrancheJITHook
          file: ./abis/TrancheJITHook.json
      eventHandlers:
        - event: "ParamsUpdated((bool,uint24,uint16,uint16,uint16,uint32,uint32,uint32,uint128,int24),uint256)"
          handler: handleParamsUpdated
        - event: "BaseFeeUpdated(uint24,uint256)"
          handler: handleBaseFeeUpdated
        - event: "QuotingEnabledSet(bool)"
          handler: handleQuotingEnabledSet
        - event: "SwapQuoted(indexed bytes32,indexed address,bool,uint16,uint24,bool,uint8)"
          handler: handleSwapQuoted
        - event: "JitDeployed(indexed bytes32,bool,int24,int24,uint128,uint256)"
          handler: handleJitDeployed
        - event: "JitRemoved(indexed bytes32,uint128,uint256,uint256)"
          handler: handleJitRemoved
        - event: "JitClaimRedeemed(indexed address,uint256)"
          handler: handleJitClaimRedeemed
        - event: "SharesWrapped(indexed address,indexed address,uint256,uint256)"
          handler: handleSharesWrapped
        - event: "SharesUnwrapped(indexed address,indexed address,uint256,uint256)"
          handler: handleSharesUnwrapped
        - event: "SuppliedToAave(indexed address,uint256)"
          handler: handleSuppliedToAave
        - event: "WithdrawnFromAave(indexed address,uint256)"
          handler: handleWithdrawnFromAave
        - event: "InventorySeeded(indexed address,uint256)"
          handler: handleInventorySeeded
        - event: "ActivePoolSet(indexed bytes32)"
          handler: handleActivePoolSet
        - event: "JitEnabledSet(bool)"
          handler: handleJitEnabledSet
        - event: "LiquidityGuardSet(bool)"
          handler: handleLiquidityGuardSet
        - event: "PausedSet(bool)"
          handler: handlePausedSet
        - event: "MaxPriceAgeUpdated(uint32)"
          handler: handleMaxPriceAgeUpdated
        - event: "ControllerUpdated(indexed address)"
          handler: handleControllerUpdated
        - event: "PriceOracleUpdated(indexed address)"
          handler: handlePriceOracleUpdated
        - event: "LendingPoolUpdated(indexed address,indexed address,indexed address)"
          handler: handleLendingPoolUpdated
        - event: "AccountantUpdated(indexed address)"
          handler: handleAccountantUpdated
        - event: "GuardianUpdated(indexed address)"
          handler: handleGuardianUpdated
        - event: "OwnerUpdated(indexed address)"
          handler: handleOwnerUpdated
        - event: "OwnershipTransferStarted(indexed address,indexed address)"
          handler: handleOwnershipTransferStarted
      blockHandlers:
        - handler: handleBlock
      file: ./src/hook.ts
  # Address synced from deployments/arc-testnet.json (npm run subgraph:sync)
  - kind: ethereum
    name: StrategyController
    network: arc-testnet
    source:
      address: "0x14F723bd9D1Cd4Ab288EeeeADb14D6a00d54Aade"
      abi: StrategyController
      startBlock: 61891077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AgentAction
      abis:
        - name: StrategyController
          file: ./abis/StrategyController.json
      eventHandlers:
        - event: "ParamsSubmitted(indexed address,(bool,uint24,uint16,uint16,uint16,uint32,uint32,uint32,uint128,int24))"
          handler: handleParamsSubmitted
        - event: "BaseFeeSubmitted(indexed address,uint24)"
          handler: handleBaseFeeSubmitted
        - event: "QuotingSubmitted(indexed address,bool)"
          handler: handleQuotingSubmitted
      file: ./src/strategy.ts
  # Address synced from deployments/arc-testnet.json (npm run subgraph:sync)
  - kind: ethereum
    name: StrategyAgent
    network: arc-testnet
    source:
      address: "0x2235C6a19C2C80e93f74915c922B1B319B954320"
      abi: StrategyAgent
      startBlock: 61891077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AgentAction
      abis:
        - name: StrategyAgent
          file: ./abis/StrategyAgent.json
      eventHandlers:
        - event: "ParamsSubmitted((bool,uint24,uint16,uint16,uint16,uint32,uint32,uint32,uint128,int24))"
          handler: handleAgentParamsSubmitted
        - event: "BaseFeeSubmitted(uint24)"
          handler: handleAgentBaseFeeSubmitted
        - event: "QuotingSubmitted(bool)"
          handler: handleAgentQuotingSubmitted
      file: ./src/strategy.ts
  # TODO: replace placeholder address + startBlock after the vault deployment
  - kind: ethereum
    name: SeniorVault
    network: arc-testnet
    source:
      address: "0x2b9Bc484b5De5ffd96e0aD37a05D0ff1B4380266"
      abi: TrancheVault
      startBlock: 61891077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - VaultState
        - VaultFlow
      abis:
        - name: TrancheVault
          file: ./abis/TrancheVault.json
      eventHandlers:
        - event: "UsdcDeposited(indexed address,indexed address,uint256,uint256)"
          handler: handleUsdcDeposited
        - event: "UsdcUnwrapped(indexed address,indexed address,uint256,uint256)"
          handler: handleUsdcUnwrapped
        - event: "SharesMoved(indexed address,uint256)"
          handler: handleSharesMoved
        - event: "DepositsPausedSet(bool)"
          handler: handleDepositsPausedSet
        - event: "MaxTotalAssetsUpdated(uint256)"
          handler: handleMaxTotalAssetsUpdated
      file: ./src/vaults.ts
  # TODO: replace placeholder address + startBlock after the vault deployment
  - kind: ethereum
    name: JuniorVault
    network: arc-testnet
    source:
      address: "0xdBEAaAc8281459510E871aBdE4bf88C8AC530F8a"
      abi: TrancheVault
      startBlock: 61891077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - VaultState
        - VaultFlow
      abis:
        - name: TrancheVault
          file: ./abis/TrancheVault.json
      eventHandlers:
        - event: "UsdcDeposited(indexed address,indexed address,uint256,uint256)"
          handler: handleUsdcDeposited
        - event: "UsdcUnwrapped(indexed address,indexed address,uint256,uint256)"
          handler: handleUsdcUnwrapped
        - event: "SharesMoved(indexed address,uint256)"
          handler: handleSharesMoved
        - event: "DepositsPausedSet(bool)"
          handler: handleDepositsPausedSet
        - event: "MaxTotalAssetsUpdated(uint256)"
          handler: handleMaxTotalAssetsUpdated
      file: ./src/vaults.ts
  # TODO: replace placeholder address + startBlock after the accountant deployment
  - kind: ethereum
    name: TrancheAccountant
    network: arc-testnet
    source:
      address: "0x8c0FACD06b0bB540F82817ee5731eDA9D8E75Ce3"
      abi: TrancheAccountant
      startBlock: 61891077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AccountantReport
        - Rebalance
        - RedemptionFulfilment
      abis:
        - name: TrancheAccountant
          file: ./abis/TrancheAccountant.json
      eventHandlers:
        - event: "DepositReported(indexed bool,uint256,uint256)"
          handler: handleDepositReported
        - event: "RedeemReported(indexed bool,uint256,uint256)"
          handler: handleRedeemReported
        - event: "Rebalanced(uint256,uint256)"
          handler: handleRebalanced
        - event: "RedeemFulfilled(indexed bool,indexed address,uint256,uint256)"
          handler: handleRedeemFulfilled
      file: ./src/accountant.ts

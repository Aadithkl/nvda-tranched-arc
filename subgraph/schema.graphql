enum MarketSession {
  None
  Regular
  Extended
  Overnight
}

type OracleState @entity(immutable: false) {
  id: ID!
  marketStatus: Int!
  lastMid: BigInt!
  lastBid: BigInt!
  lastAsk: BigInt!
  lastSourceTimestamp: BigInt!
  lastUpdatedAt: BigInt!
  lastWriter: Bytes
  lastPaymentRef: Bytes
  totalUpdates: BigInt!
}

type PriceUpdate @entity(immutable: true) {
  id: ID!
  mid: BigInt!
  bid: BigInt!
  ask: BigInt!
  marketStatus: Int!
  session: MarketSession!
  sourceTimestamp: BigInt!
  updatedAt: BigInt!
  writer: Bytes!
  paymentRef: Bytes!
  transactionHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type Pool @entity(immutable: false) {
  id: ID!
  currency0: Bytes!
  currency1: Bytes!
  fee: BigInt!
  tickSpacing: BigInt!
  hooks: Bytes!
  sqrtPriceX96: BigInt!
  tick: BigInt!
  liquidity: BigInt!
  volume0: BigInt!
  volume1: BigInt!
  swapCount: BigInt!
  initializedAtTimestamp: BigInt!
  updatedAtTimestamp: BigInt!
}

type PoolSwap @entity(immutable: true) {
  id: ID!
  pool: Pool!
  sender: Bytes!
  amount0: BigInt!
  amount1: BigInt!
  sqrtPriceX96: BigInt!
  liquidity: BigInt!
  tick: BigInt!
  fee: BigInt!
  transactionHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

enum QuoteState {
  Rest
  Degraded
  Active
}

type HookState @entity(immutable: false) {
  id: ID!
  owner: Bytes
  pendingOwner: Bytes
  guardian: Bytes
  controller: Bytes
  priceOracle: Bytes
  accountant: Bytes
  lendingPool: Bytes
  aToken: Bytes
  aTokenEquity: Bytes
  activePoolId: Bytes
  quotingEnabled: Boolean!
  jitEnabled: Boolean!
  liquidityGuard: Boolean!
  paused: Boolean!
  maxPriceAge: BigInt!
  baseFee: BigInt!
  maxSurgeFee: BigInt!
  maxDeviationBps: Int!
  toxicityMultiplierBps: Int!
  minEvBps: Int!
  cooldownSeconds: Int!
  ttl: Int!
  gracePeriod: Int!
  maxDeployPerSwap: BigInt!
  bucketTicks: Int!
  paramsUpdatedAt: BigInt
  totalQuotes: BigInt!
  totalJitDeployments: BigInt!
  totalJitRemovals: BigInt!
  totalWraps: BigInt!
  totalUnwraps: BigInt!
  totalSeedUsdc: BigInt!
  totalSuppliedToAave: BigInt!
  totalWithdrawnFromAave: BigInt!
  updatedAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
}

type Quote @entity(immutable: true) {
  id: ID!
  poolId: Bytes!
  sender: Bytes!
  zeroForOne: Boolean!
  deviationBps: Int!
  fee: BigInt!
  toxic: Boolean!
  state: QuoteState!
  transactionHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
}

type JitDeployment @entity(immutable: true) {
  id: ID!

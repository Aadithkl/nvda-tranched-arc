[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
via_ir = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
gas_reports = ["*"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
# Arcscan verification config added at deployment time

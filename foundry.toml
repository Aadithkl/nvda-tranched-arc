[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./out" }]
gas_reports = ["*"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
robinhood_mainnet = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
# Arcscan verification config added at deployment time
# robinhood = { key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }

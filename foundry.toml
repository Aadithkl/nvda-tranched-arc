[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
gas_reports = ["*"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
# Arcscan verification config added at deployment time
